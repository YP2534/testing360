<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern 360 Virtual Tour</title>
    
    <!-- Pannellum Library -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        /* General Setup */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #panorama { width: 100vw; height: 100vh; }

        /* Modern Top Bar */
        #top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 50px;
            background-color: #4B5259;
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 600; z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Edit Mode Toggle Button */
        #edit-toggle {
            position: absolute; right: 20px;
            background-color: #e74c3c; color: white; border: none;
            padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        #edit-toggle:hover { background-color: #c0392b; }

        /* Pop-up Angle Editor */
        #rotate-editor {
            display: none; position: absolute; z-index: 100;
            background: #2c3e50; color: white; padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 220px; border: 2px solid #34495e;
        }
        #rotate-editor input[type="range"] { width: 100%; margin: 15px 0; }
        .close-editor-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; width: 100%; }

        /* Modern Side Menu */
        #side-menu {
            position: absolute; top: 50px; left: 0; width: 250px; height: calc(100vh - 50px);
            background-color: rgba(75, 82, 89, 0.9);
            color: white; overflow-y: auto; z-index: 10;
            backdrop-filter: blur(5px);
        }

        .menu-item {
            padding: 15px 20px; font-size: 14px; cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: background 0.3s;
        }

        .menu-item:hover { background-color: rgba(255,255,255,0.2); }

        /* Hide Pannellum's default title, zoom, and fullscreen controls */
        .pnlm-title-box, .pnlm-zoom-controls, .pnlm-fullscreen-toggle { display: none !important; }

        /* Custom Stable Arrow Icon with Tooltip Setup */
        .custom-arrow {
            width: 46px; height: 46px;
            background-color: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(255,255,255,0.95); border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-sizing: border-box;
            transition: background-color 0.2s, box-shadow 0.2s;
            will-change: background-color;
        }
        
        .custom-arrow:hover {
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.16);
        }

        /* The actual arrow shape inside the circle - NOW USES CSS VARIABLES FOR SMOOTH ROTATION */
        .custom-arrow::after {
            content: ''; display: block;
            width: 12px; height: 12px;
            border-top: 3px solid white; border-right: 3px solid white;
            /* Default points Right (45deg), controlled dynamically by the variable */
            transform: rotate(var(--dynamic-angle, 45deg));
        }

        /* Tooltip text that appears on hover */
        .custom-arrow span {
            visibility: hidden; position: absolute;
            top: -35px; left: 50%; transform: translateX(-50%);
            background-color: rgba(0,0,0,0.8); color: white;
            padding: 5px 10px; border-radius: 4px;
            white-space: nowrap; font-size: 13px; font-weight: 500;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }

        /* Custom Arrow Directions mapping to CSS variables */
        .custom-arrow.arrow-up { --dynamic-angle: -45deg; }
        .custom-arrow.arrow-left { --dynamic-angle: -135deg; }
        .custom-arrow.arrow-right { --dynamic-angle: 45deg; }
        .custom-arrow.arrow-back { --dynamic-angle: 135deg; }
        
        .custom-arrow:hover span { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

<!-- Custom UI Overlays -->
<div id="top-bar">
    <span id="top-title">Top View</span>
    <button id="edit-toggle">Enable Edit Mode</button>
</div>

<!-- The Angle Editor Pop-up -->
<div id="rotate-editor">
    <div style="font-size:14px; font-weight:bold;">Angle: <span id="angle-display">0</span>°</div>
    <input type="range" id="angle-slider" min="-180" max="180" value="0">
    <div style="font-size:11px; margin-bottom:10px; color:#bdc3c7;">(Take note of this number!)</div>
    <button class="close-editor-btn" onclick="document.getElementById('rotate-editor').style.display='none'">Close</button>
</div>

<div id="side-menu">
    <div class="menu-item" onclick="changeScene('scene1')">Top View</div>
    <div class="menu-item" onclick="changeScene('scene2')">Top View from Entry</div>
    <div class="menu-item" onclick="changeScene('scene3')">Entrance from Road</div>
    <div class="menu-item" onclick="changeScene('scene4')">Main Gate</div>
    <div class="menu-item" onclick="changeScene('scene5')">Parking Entry</div>
    <div class="menu-item" onclick="changeScene('scene6')">Parking Circle</div>
    <div class="menu-item" onclick="changeScene('scene7')">Entrance from Lawn</div>
    <div class="menu-item" onclick="changeScene('scene8')">Pratishthan front view</div>
    <div class="menu-item" onclick="changeScene('scene9')">Main Lawn Stage</div>
    <div class="menu-item" onclick="changeScene('scene10')">Golden Gate</div>
    <div class="menu-item" onclick="changeScene('scene11')">Ganesh Dwar</div>
    <div class="menu-item" onclick="changeScene('scene12')">Quawalli Hall</div>
    <div class="menu-item" onclick="changeScene('scene13')">Umbrella Tree</div>
    <div class="menu-item" onclick="changeScene('scene14')">Back side Pratishthan O...</div>
    <div class="menu-item" onclick="changeScene('scene15')">Back side Garden</div>
</div>

<div id="panorama"></div>

<script>
    const sceneTitles = {
        "scene1": "Top View", "scene2": "Top View from Entry", "scene3": "Entrance from Road",
        "scene4": "Main Gate", "scene5": "Parking Entry", "scene6": "Parking Circle",
        "scene7": "Entrance from Lawn", "scene8": "Pratishthan front view", "scene9": "Main Lawn Stage",
        "scene10": "Golden Gate", "scene11": "Ganesh Dwar", "scene12": "Quawalli Hall",
        "scene13": "Umbrella Tree", "scene14": "Back side Pratishthan O...", "scene15": "Back side Garden"
    };

    // --- EDIT MODE LOGIC ---
    let isEditMode = false;
    let currentEditHotspot = null;

    document.getElementById('edit-toggle').onclick = function() {
        isEditMode = !isEditMode;
        this.innerText = isEditMode ? "Exit Edit Mode" : "Enable Edit Mode";
        this.style.backgroundColor = isEditMode ? "#27ae60" : "#e74c3c";
        if(!isEditMode) document.getElementById('rotate-editor').style.display = 'none';
    };

    // Updates slider when moved
    document.getElementById('angle-slider').oninput = function() {
        if(currentEditHotspot) {
            let val = this.value;
            document.getElementById('angle-display').innerText = val;
            currentEditHotspot.setAttribute('data-custom-angle', val);
            currentEditHotspot.style.setProperty('--dynamic-angle', val + 'deg');
        }
    };

    // Intercepts clicks for Pannellum Hotspots
    function hotspotTooltip(hotSpotDiv, args) {
        hotSpotDiv.classList.add('custom-tooltip');
        var span = document.createElement('span');
        span.innerHTML = args;
        hotSpotDiv.appendChild(span);

        // Blocks Pannellum from loading the next scene while editing
        function handleEditClick(e) {
            if (isEditMode) {
                e.stopPropagation();
                e.preventDefault();
                
                // Open Editor Slider
                currentEditHotspot = hotSpotDiv;
                const editor = document.getElementById('rotate-editor');
                editor.style.display = 'block';
                editor.style.left = (e.clientX + 15) + 'px';
                editor.style.top = (e.clientY + 15) + 'px';
                
                // Read current angle
                let currentAngle = 45; // Default Right
                if (hotSpotDiv.hasAttribute('data-custom-angle')) {
                    currentAngle = parseInt(hotSpotDiv.getAttribute('data-custom-angle'));
                } else {
                    // Extract initial angle from CSS classes
                    if (hotSpotDiv.classList.contains('arrow-up')) currentAngle = -45;
                    else if (hotSpotDiv.classList.contains('arrow-left')) currentAngle = -135;
                    else if (hotSpotDiv.classList.contains('arrow-back')) currentAngle = 135;
                }

                // Set slider value
                document.getElementById('angle-slider').value = currentAngle;
                document.getElementById('angle-display').innerText = currentAngle;
            }
        }

        // Attach listeners to stop the scene jump
        hotSpotDiv.addEventListener('pointerdown', handleEditClick, true);
        hotSpotDiv.addEventListener('click', handleEditClick, true);
        hotSpotDiv.addEventListener('mousedown', function(e){ if(isEditMode) { e.stopPropagation(); e.preventDefault(); } }, true);
        hotSpotDiv.addEventListener('mouseup', function(e){ if(isEditMode) { e.stopPropagation(); e.preventDefault(); } }, true);
    }

    const viewer = pannellum.viewer('panorama', {
        "default": {
            "firstScene": "scene1",
            "sceneFadeDuration": 1000,
            "autoLoad": true,
            "hfov": 100,
            "showZoomCtrl": false,       
            "showFullscreenCtrl": false
        },
        "scenes": {
            "scene1": {
                "type": "equirectangular", "panorama": "images/pano1.jpg", "pitch": -20, "yaw": 60,
                "hotSpots": [ 
                    { "pitch": -8.28, "yaw": 80.81, "type": "scene", "sceneId": "scene2", "cssClass": "custom-arrow arrow-up", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Top View from Entry" },
                    { "pitch": -68.46, "yaw": 85.05, "type": "scene", "sceneId": "scene3", "cssClass": "custom-arrow arrow-back", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Entrance from Road" }
                ]
            },
            "scene2": {
                "type": "equirectangular", "panorama": "images/pano2.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [ 
                    { "pitch": -16.19, "yaw": -63.43, "type": "scene", "sceneId": "scene3", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Entrance from Road" },
                    { "pitch": -14.44, "yaw": 50.88, "type": "scene", "sceneId": "scene10", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Golden Gate" } 
                ]
            },
            "scene3": {
                "type": "equirectangular", "panorama": "images/pano3.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [ 
                    { "pitch": 5.80, "yaw": 123.10, "type": "scene", "sceneId": "scene2", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Top View from Entry" },
                    { "pitch": -24.58, "yaw": 2.32, "type": "scene", "sceneId": "scene4", "cssClass": "custom-arrow arrow-up", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Main Gate" } 
                ]
            },
            "scene4": {
                "type": "equirectangular", "panorama": "images/pano4.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [ 
                    { "pitch": -21.64, "yaw": 174.63, "type": "scene", "sceneId": "scene3", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Entrance from Road" },
                    { "pitch": -11.32, "yaw": -0.08, "type": "scene", "sceneId": "scene5", "cssClass": "custom-arrow arrow-up", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Parking Entry" } 
                ]
            },
            "scene5": {
                "type": "equirectangular", "panorama": "images/pano5.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [ 
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene4", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Main Gate" },
                    { "pitch": -18.85, "yaw": -0.71, "type": "scene", "sceneId": "scene6", "cssClass": "custom-arrow arrow-up", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Parking Circle" } 
                ]
            },
            "scene6": {
                "type": "equirectangular", "panorama": "images/pano6.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [ 
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene5", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Parking Entry" },
                    { "pitch": -4.97, "yaw": 7.22, "type": "scene", "sceneId": "scene7", "cssClass": "custom-arrow arrow-up", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Entrance from Lawn" } 
                ]
            },
            "scene7": {
                "type": "equirectangular", "panorama": "images/pano7.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [ 
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene6", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Parking Circle" },
                    { "pitch": -4.63, "yaw": 50.59, "type": "scene", "sceneId": "scene8", "cssClass": "custom-arrow arrow-right", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Pratishthan front view" } 
                ]
            },
            "scene8": {
                "type": "equirectangular", "panorama": "images/pano8.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [ 
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene7", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Entrance from Lawn" },
                    { "pitch": -22.69, "yaw": 95.26, "type": "scene", "sceneId": "scene9", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Main Lawn Stage" },
                    { "pitch": -6.21, "yaw": 114.51, "type": "scene", "sceneId": "scene10", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Golden Gate" } 
                ]
            },
            "scene9": {
                "type": "equirectangular", "panorama": "images/pano9.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene8", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Pratishthan front view" },
                    { "pitch": -13.16, "yaw": 33.52, "type": "scene", "sceneId": "scene10", "cssClass": "custom-arrow arrow-right", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Golden Gate" }
                ]
            },
            "scene10": {
                "type": "equirectangular", "panorama": "images/pano10.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene9", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Main Lawn Stage" },
                    { "pitch": -6.71, "yaw": 3.53, "type": "scene", "sceneId": "scene11", "cssClass": "custom-arrow arrow-up", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Ganesh Dwar" }
                ]
            },
            "scene11": {
                "type": "equirectangular", "panorama": "images/pano11.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene10", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Golden Gate" },
                    { "pitch": -10.91, "yaw": -10.73, "type": "scene", "sceneId": "scene12", "cssClass": "custom-arrow arrow-left", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Quawalli Hall" },
                    { "pitch": -4.20, "yaw": 74.49, "type": "scene", "sceneId": "scene13", "cssClass": "custom-arrow arrow-right", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Umbrella Tree" }
                ]
            },
            "scene12": {
                "type": "equirectangular", "panorama": "images/pano12.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene11", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Ganesh Dwar" },
                    { "pitch": -10.01, "yaw": -66.76, "type": "scene", "sceneId": "scene13", "cssClass": "custom-arrow arrow-left", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Umbrella Tree" } 
                ]
            },
            "scene13": {
                "type": "equirectangular", "panorama": "images/pano13.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene12", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Quawalli Hall" },
                    { "pitch": -12.36, "yaw": -7.45, "type": "scene", "sceneId": "scene14", "cssClass": "custom-arrow arrow-up", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Back side Pratishthan O..." },
                    { "pitch": -9.73, "yaw": -23.22, "type": "scene", "sceneId": "scene15", "cssClass": "custom-arrow arrow-left", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Back side Garden" }
                ]
            },
            "scene14": {
                "type": "equirectangular", "panorama": "images/pano14.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [ 
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene13", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Umbrella Tree" },
                    { "pitch": -15.33, "yaw": -161.12, "type": "scene", "sceneId": "scene15", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Back side Garden" } 
                ]
            },
            "scene15": {
                "type": "equirectangular", "panorama": "images/pano15.jpg", "pitch": 0, "yaw": 0,
                "hotSpots": [ 
                    { "pitch": 0, "yaw": -100, "type": "scene", "sceneId": "scene14", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Back side Pratishthan O..." },
                    { "pitch": 0, "yaw": 100, "type": "scene", "sceneId": "scene1", "cssClass": "custom-arrow", "createTooltipFunc": hotspotTooltip, "createTooltipArgs": "Top View" } 
                ]
            }
        }
    });

    function changeScene(sceneId) {
        viewer.loadScene(sceneId);
        document.getElementById('top-title').innerText = sceneTitles[sceneId];
    }

    viewer.on('scenechange', function(sceneId) {
        document.getElementById('top-title').innerText = sceneTitles[sceneId];
    });

</script>
</body>
</html>
