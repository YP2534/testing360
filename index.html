<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern 360 Virtual Tour</title>
    
    <!-- Pannellum Library -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        /* General Setup */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background: #222; }
        #panorama { width: 100vw; height: 100vh; }

        /* Modern Top Bar */
        #top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 55px;
            background-color: rgba(40, 44, 52, 0.85);
            color: #ffffff; display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 500; z-index: 10;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Menu Toggle Button (Left) */
        #menu-toggle {
            position: absolute;
            left: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 5px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        #menu-toggle:hover { opacity: 1; }
        .hamburger-icon { width: 24px; height: 24px; fill: white; }

        /* Modern Music Toggle Button (Right) */
        #music-toggle {
            position: absolute;
            right: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: opacity 0.2s, transform 0.2s;
            gap: 5px; /* Spacing between music icon and arrow */
        }
        #music-toggle:hover { opacity: 0.7; transform: scale(1.05); }
        
        .music-icon {
            width: 20px;
            height: 20px;
            stroke: white;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Small Downward Arrow for Dropdown */
        .dropdown-arrow {
            width: 12px;
            height: 12px;
            fill: white;
            transition: transform 0.2s;
        }

        /* ---------------------------------------------------
           UPDATED VOLUME DROPDOWN MENU
           --------------------------------------------------- */
        #volume-dropdown {
            position: absolute; top: 60px; right: 20px; 
            background-color: rgba(40, 44, 52, 0.95); 
            padding: 15px 20px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            display: flex; flex-direction: column; gap: 12px; 
            opacity: 0; pointer-events: none; 
            transition: opacity 0.2s, transform 0.2s; 
            transform: translateY(-10px); z-index: 20; 
            color: white; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        #volume-dropdown.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        
        .vol-row { display: flex; align-items: center; justify-content: center; gap: 15px; }
        
        input[type=range] { 
            width: 120px; cursor: pointer; accent-color: #ffffff; 
        }

        .play-pause-btn { cursor: pointer; display: flex; align-items: center; transition: opacity 0.2s; }
        .play-pause-btn:hover { opacity: 0.7; }
        
        .playlist-text { font-size: 12px; color: #a1a1aa; text-align: right; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;}

        /* ---------------------------------------------------
           NEW BOTTOM RIGHT ZOOM CONTROLS (+ / -)
           --------------------------------------------------- */
        #bottom-right-controls {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        
        .br-btn {
            width: 36px; 
            height: 36px;
            background-color: rgba(40, 44, 52, 0.75);
            color: white; 
            font-size: 22px; 
            font-weight: 400;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            backdrop-filter: blur(4px);
        }
        
        .br-btn:hover { 
            background-color: rgba(40, 44, 52, 1); 
            transform: scale(1.05);
        }
        .br-btn:active {
            transform: scale(0.95);
        }

        /* Modern Side Menu */
        #side-menu {
            position: absolute; top: 55px; left: 0; width: 260px; height: calc(100vh - 55px);
            background-color: rgba(30, 33, 40, 0.95);
            color: #d1d5db; overflow-y: auto; z-index: 10;
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding-top: 10px;
        }

        #side-menu.hidden {
            transform: translateX(-100%);
        }

        .menu-item {
            padding: 14px 24px; 
            font-size: 14px; 
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background 0.2s, color 0.2s, border-left 0.2s;
        }

        .menu-item:hover { 
            background-color: rgba(255,255,255,0.08); 
            color: #ffffff;
            border-left: 3px solid #ffffff;
        }

        /* Hide Pannellum's default elements */
        .pnlm-title-box, .pnlm-zoom-controls, .pnlm-fullscreen-toggle, .pnlm-load-box { display: none !important; }

        /* ---------------------------------------------------
           YOUR ORIGINAL HOTSPOT CSS (UNCHANGED)
           --------------------------------------------------- */
        .custom-arrow {
            width: 46px; height: 46px;
            background-color: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(255,255,255,0.95); border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-sizing: border-box;
            transition: background-color 0.2s, box-shadow 0.2s;
            will-change: background-color;
        }
        
        .custom-arrow:hover {
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.16);
        }

        .custom-arrow::after {
            content: ''; display: block;
            width: 12px; height: 12px;
            border-top: 3px solid white; border-right: 3px solid white;
            transform: rotate(var(--arrow-angle, 45deg)); margin-left: -4px;
        }

        .custom-arrow span {
            visibility: hidden; position: absolute;
            top: -35px; left: 50%; transform: translateX(-50%);
            background-color: rgba(0,0,0,0.8); color: white;
            padding: 5px 10px; border-radius: 4px;
            white-space: nowrap; font-size: 13px; font-weight: 500;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }

        .custom-arrow:hover span { visibility: visible; opacity: 1; }

        /* Mobile tweaks */
        @media (max-width: 768px) {
            #top-title { font-size: 15px; }
            #bottom-right-controls { bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>

<!-- Custom UI Overlays -->
<div id="top-bar">
    <div id="menu-toggle" onclick="toggleMenu()">
        <!-- Sleek Hamburger SVG -->
        <svg class="hamburger-icon" viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
    </div>
    <span id="top-title">Top View</span>
    <!-- Toggle Volume Dropdown -->
    <div id="music-toggle" onclick="toggleVolumeMenu(event)">
        <!-- Music Note Icon -->
        <svg class="music-icon" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <!-- Downward Arrow -->
        <svg class="dropdown-arrow" viewBox="0 0 24 24">
            <path d="M7 10l5 5 5-5z"></path>
        </svg>
    </div> 
</div>

<!-- Volume and Music Dropdown Menu -->
<div id="volume-dropdown">
    <div class="vol-row">
        <!-- Play / Pause Icon -->
        <div id="play-pause-container" class="play-pause-btn" onclick="toggleMusicPlayback()">
            <svg id="dropdown-icon-playing" class="music-icon" viewBox="0 0 24 24">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
        </div>
        
        <!-- Slider -->
        <input type="range" id="vol-slider" min="0" max="100" value="100" oninput="changeVolume(this.value)">
    </div>
    <div class="playlist-text">By: PlayList</div>
</div>

<!-- Floating Plus / Minus Zoom Controls at Bottom Right -->
<div id="bottom-right-controls">
    <div class="br-btn" onclick="zoomPanorama(-15)">+</div>
    <div class="br-btn" onclick="zoomPanorama(15)">-</div>
</div>

<div id="side-menu">
    <div class="menu-item" onclick="changeScene('scene1')">Top View</div>
    <div class="menu-item" onclick="changeScene('scene2')">Top View from Entry</div>
    <div class="menu-item" onclick="changeScene('scene3')">Entrance from Road</div>
    <div class="menu-item" onclick="changeScene('scene4')">Main Gate</div>
    <div class="menu-item" onclick="changeScene('scene5')">Parking Entry</div>
    <div class="menu-item" onclick="changeScene('scene6')">Parking Circle</div>
    <div class="menu-item" onclick="changeScene('scene7')">Entrance from Lawn</div>
    <div class="menu-item" onclick="changeScene('scene8')">Pratishthan front view</div>
    <div class="menu-item" onclick="changeScene('scene9')">Main Lawn Stage</div>
    <div class="menu-item" onclick="changeScene('scene10')">Golden Gate</div>
    <div class="menu-item" onclick="changeScene('scene11')">Ganesh Dwar</div>
    <div class="menu-item" onclick="changeScene('scene12')">Quawalli Hall</div>
    <div class="menu-item" onclick="changeScene('scene13')">Umbrella Tree</div>
    <div class="menu-item" onclick="changeScene('scene14')">Back side Pratishthan O...</div>
    <div class="menu-item" onclick="changeScene('scene15')">Back side Garden</div>
</div>

<div id="panorama"></div>

<!-- Hidden div for YouTube Player -->
<div id="ytplayer" style="display:none;"></div>

<script>
    // --- YOUTUBE AUDIO BACKGROUND LOGIC ---
    let player;
    let isUserInteracted = false;
    
    // SVG strings for the toggle states inside dropdown
    const iconPlaying = `<svg class="music-icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`;
    const iconPaused = `<svg class="music-icon" viewBox="0 0 24 24" style="stroke: #ff6b6b;"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('ytplayer', {
            height: '0', 
            width: '0',
            videoId: '312SQ9kea8M',
            playerVars: { 
                'autoplay': 1, 
                'start': 579,  // 9:39 in seconds
                'end': 2525,   // 42:05 in seconds
                'controls': 0,
                'rel': 0,
                'showinfo': 0,
                'enablejsapi': 1
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        // Try to play immediately (might be blocked by browser)
        event.target.playVideo();
        document.getElementById('vol-slider').value = event.target.getVolume();
    }

    function onPlayerStateChange(event) {
        const dpIcon = document.getElementById('play-pause-container');
        
        if (event.data === YT.PlayerState.PLAYING) {
            dpIcon.innerHTML = iconPlaying;
        } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.UNSTARTED) {
            dpIcon.innerHTML = iconPaused;
        } else if (event.data === YT.PlayerState.ENDED) {
            player.seekTo(579);
            player.playVideo();
        }
    }

    function toggleMusicPlayback() {
        if (player && player.getPlayerState) {
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }
    }

    // Dropdown UI functions
    function toggleVolumeMenu(e) {
        e.stopPropagation();
        const dropdown = document.getElementById('volume-dropdown');
        const arrow = document.querySelector('.dropdown-arrow');
        
        dropdown.classList.toggle('show');
        
        // Rotate the arrow when menu is open
        if (dropdown.classList.contains('show')) {
            arrow.style.transform = 'rotate(180deg)';
        } else {
            arrow.style.transform = 'rotate(0deg)';
        }
    }

    function changeVolume(val) {
        if (player && player.setVolume) {
            player.setVolume(val);
        }
        document.getElementById('vol-slider').value = val;
    }

    // --- ZOOM CONTROL LOGIC ---
    function zoomPanorama(step) {
        if (viewer) {
            // Get current Field of View
            let currentHfov = viewer.getHfov();
            // Calculate new Field of View
            let newHfov = currentHfov + step;
            
            // Limit zoom in (min HFOV) and zoom out (max HFOV)
            if (newHfov < 40) newHfov = 40;   
            if (newHfov > 120) newHfov = 120; 
            
            // Set the new zoom level
            viewer.setHfov(newHfov);
        }
    }

    // --- FIX FOR BROWSERS BLOCKING AUTOPLAY ---
    // The very first time a user clicks anywhere on the page, force the video to play.
    document.addEventListener('click', function(e) {
        if (!isUserInteracted && player && player.getPlayerState) {
            if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                player.playVideo();
                isUserInteracted = true; // Only run this once
            }
        }

        // Close dropdown if clicking outside
        if (!e.target.closest('#volume-dropdown') && !e.target.closest('#music-toggle')) {
            document.getElementById('volume-dropdown').classList.remove('show');
            document.querySelector('.dropdown-arrow').style.transform = 'rotate(0deg)';
        }
    });


    // --- UI AND VIRTUAL TOUR LOGIC ---
    const sceneTitles = {
        "scene1": "Top View", "scene2": "Top View from Entry", "scene3": "Entrance from Road",
        "scene4": "Main Gate", "scene5": "Parking Entry", "scene6": "Parking Circle",
        "scene7": "Entrance from Lawn", "scene8": "Pratishthan front view", "scene9": "Main Lawn Stage",
        "scene10": "Golden Gate", "scene11": "Ganesh Dwar", "scene12": "Quawalli Hall",
        "scene13": "Umbrella Tree", "scene14": "Back side Pratishthan O...", "scene15": "Back side Garden"
    };

    if (window.innerWidth <= 768) {
        document.getElementById('side-menu').classList.add('hidden');
    }

    function toggleMenu() {
        const sideMenu = document.getElementById('side-menu');
        sideMenu.classList.toggle('hidden');
    }

    // ORIGINAL HOTSPOT FUNCTION
    function hotspotTooltip(hotSpotDiv, args) {
        hotSpotDiv.classList.add('custom-tooltip');
        var span = document.createElement('span');
        
        if (typeof args === 'object') {
            span.innerHTML = args.text;
            hotSpotDiv.style.setProperty('--arrow-angle', args.angle + 'deg');

            span.innerHTML = args;
